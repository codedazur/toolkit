packages:
  - apps/*
  - packages/*

# Also link workspace packages into subdependencies (e.g. the @codedazur/react-*
# dependencies of @codedazur/fusion-ui) when the version satisfies the range,
# so that apps don't end up with a second copy of their React contexts.
linkWorkspacePackages: deep

# Don't install versions that were published less than 3 days ago (in minutes).
minimumReleaseAge: 4320

# Dependency install scripts only run when listed here as `true`. None are
# needed: these packages either ship prebuilt binaries through platform-specific
# optional dependencies (their scripts are only a fallback) or just print a
# message. Review new entries before allowing them.
allowBuilds:
  "@parcel/watcher": false
  "@sentry/cli": false
  "@swc/core": false
  core-js-pure: false
  esbuild: false

overrides:
  elliptic: ^6.6.1
  fast-uri: ^3.1.9
  form-data: ^4.0.6

audit:
  ignore:
    # picomatch <=4.0.7 ReDoS (no patched release yet). It only reaches our
    # packages through ESLint tooling (tinyglobby), not through shipped code.
    # Remove this once a patched picomatch is released and resolved.
    - GHSA-fc5q-39xc-vjpf
